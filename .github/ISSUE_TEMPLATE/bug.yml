name: Bug report
description: A check, hook or setup step misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of `python scripts/setup.py --check`
      render: text
  - type: input
    id: env
    attributes:
      label: OS, Python version, and agent (Claude Code, Codex, other) with version
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Please do not paste real personal data. Use the fictional cases in evals/cases/ to reproduce."
