name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uv:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} (uv)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install poppler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Setup (same command users run)
        run: uv run scripts/setup.py
      - name: Verify setup
        run: uv run scripts/setup.py --check --skip-tests
      - name: Unit tests
        run: uv run --group dev pytest -q
        env:
          NOMAGIC_SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
          NOMAGIC_SMOKE_DUMP_PDF: "1"
      - name: Upload smoke-test PDFs (only when tests fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
      - name: Build Claude app skill zip
        run: uv run scripts/setup.py --zip --skip-tests

  pip-fallback:
    name: ubuntu / Python 3.12 (no uv)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup without uv
        run: python scripts/setup.py
      - name: Verify setup
        run: python scripts/setup.py --check --skip-tests
