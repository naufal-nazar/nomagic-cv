[project]
name = "nomagic-cv"
version = "0.1.0"
description = "Open-source AI resume & CV agent: numbers, titles and dates checked against your fact sheet by code; every rule graded against published research."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Noufal Nazar" }]
keywords = ["resume", "cv", "ats", "job-search", "ai-agent", "claude-code", "codex", "agent-skills"]
dependencies = [
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "dnspython>=2.6",
]

[project.optional-dependencies]
pdf = ["rendercv[full]>=2.0"]

[project.urls]
Homepage = "https://github.com/naufal-nazar/nomagic-cv"
Issues = "https://github.com/naufal-nazar/nomagic-cv/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pillow>=10.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
